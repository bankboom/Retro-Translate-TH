name: Omega P4/P5 Translation Integrity Tests

on:
  push:
    paths:
      - 'projects/pokemon-omega-paradox/tools/**'
      - 'projects/pokemon-omega-paradox/translation/P3_9*'
      - 'projects/pokemon-omega-paradox/translation/P4_1*'
      - 'projects/pokemon-omega-paradox/translation/P4_2*'
      - 'projects/pokemon-omega-paradox/translation/P4_8*'
      - 'projects/pokemon-omega-paradox/translation/P4_9*'
      - 'projects/pokemon-omega-paradox/translation/P5_0*'
      - 'projects/pokemon-omega-paradox/translation/P5_1*'
      - 'projects/pokemon-omega-paradox/translation/P5_2*'
      - '.github/workflows/omega-p40-static-tests.yml'
  workflow_dispatch:

jobs:
  static-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile P4 audit and QA scripts
        run: python -m compileall -q projects/pokemon-omega-paradox/tools
      - name: Run static audit and draft control-code tests
        run: python -m unittest discover -s projects/pokemon-omega-paradox/tools -p 'test_p*.py' -v

      - name: P4.8 merge-readiness for all 270 full-message drafts
        run: |
          python projects/pokemon-omega-paradox/tools/p47_full_scope_merge.py \
            --check-drafts-only > /tmp/omega-p47-draft-preflight.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/omega-p47-draft-preflight.json'))
          assert r["draft_rows"]==270
          assert r["unique_message_ids"]==270
          assert not r["counts"].get("MULTIPLE_TRANSLATION_VARIANTS_NEED_CONTEXT",0)
          PY
      - name: P4.3 draft glyph-readiness audit (no ROM writes)
        run: |
          python projects/pokemon-omega-paradox/tools/p43_preflight_existing_drafts.py --out /tmp/omega-p43-glyph-preflight.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/omega-p43-glyph-preflight.json'))
          assert p['total_draft_rows']==67 and p['distinct_ids']==67
          assert not p['bps_created'] and not p['code_injected']
          assert sum(p['counts'].values())==67
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: omega-p50-draft-inventory
          path: /tmp/omega-p47-draft-preflight.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: omega-p43-glyph-preflight
          path: /tmp/omega-p43-glyph-preflight.json
          if-no-files-found: error
