name: Omega P4.0-P4.1 Static Integrity Tests

on:
  push:
    paths:
      - 'projects/pokemon-omega-paradox/tools/**'
      - 'projects/pokemon-omega-paradox/translation/P4_1*'
      - '.github/workflows/omega-p40-static-tests.yml'
  workflow_dispatch:

jobs:
  static-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile P4 audit and QA scripts
        run: python -m compileall -q projects/pokemon-omega-paradox/tools
      - name: Run static audit and draft control-code tests
        run: python -m unittest discover -s projects/pokemon-omega-paradox/tools -p 'test_p4*.py' -v
